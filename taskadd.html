<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Campaign Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display',-apple-system,BlinkMacSystemFont,Roboto,sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 40px; }

        #loader-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(150px); width: calc(100% - 40px); max-width: 440px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 16px 24px; border-radius: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 10000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #loader-overlay.active { transform: translateX(-50%) translateY(0); }
        .vip-spinner { position: relative; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .vip-spinner-ring { position: absolute; width: 100%; height: 100%; border: 3px solid rgba(79, 70, 229, 0.2); border-top: 3px solid #6366f1; border-radius: 50%; animation: vipSpin 0.8s linear infinite; }
        .vip-spinner i { color: #6366f1; font-size: 12px; }
        .loader-text { font-size: 13px; font-weight: 700; color: #ffffff; flex: 1; }
        @keyframes vipSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-bar { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: white; padding: 18px 20px; display: flex; align-items: center; gap: 15px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .top-bar i { cursor: pointer; font-size: 18px; }

        .container { max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .section-title { font-size: 15px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: #4f46e5; }

        .form-card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 16px; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .input-group label i { margin-right: 4px; color: #4f46e5; }
        
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px; font-size: 13px; background: #f8fafc; outline: none; font-weight: 600; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: #4f46e5; background: white; }
        
        .upload-methods { display: flex; gap: 10px; margin-bottom: -4px; }
        .method-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; text-align: center; }
        .method-btn.active { background: #eef2ff; border-color: #4f46e5; color: #4f46e5; }

        .file-wrapper { position: relative; width: 100%; height: 50px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 14px; display: flex; align-items: center; padding: 0 15px; }
        .file-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .img-preview-box { width: 100%; height: 130px; border-radius: 14px; background: #f1f5f9; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .img-preview-box span { font-size: 12px; color: #94a3b8; font-weight: 600; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, #4f46e5, #3730a3); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(79,70,229,0.3); margin-top: 10px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="vip-spinner"><div class="vip-spinner-ring"></div><i class="fa-solid fa-crown"></i></div>
        <div class="loader-text" id="loader-msg">Deploying Task...</div>
    </div>

    <div class="top-bar">
        <i class="fa-solid fa-chevron-left" onclick="window.location.href='admin.html'"></i>
        <span>Create Smart Campaign</span>
    </div>

    <div class="container">
        <h2 class="section-title"><i class="fa-solid fa-plus-circle"></i> Add Smart Task</h2>
        
        <div class="form-card">
            <div class="input-group">
                <label><i class="fa-solid fa-heading"></i> Task Title</label>
                <input type="text" id="task-name" placeholder="e.g. Subscribe Channel & Screenshot">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-sliders"></i> Thumbnail Source</label>
                <div class="upload-methods">
                    <div class="method-btn active" id="btn-link-mode" onclick="switchMode('link')"><i class="fa-solid fa-link"></i> Web Link</div>
                    <div class="method-btn" id="btn-file-mode" onclick="switchMode('file')"><i class="fa-solid fa-cloud-arrow-up"></i> Upload File</div>
                </div>
            </div>

            <div class="input-group" id="input-link-container">
                <input type="text" id="task-image-link" placeholder="https://example.com/image.jpg" oninput="previewUrlImage(this.value)">
            </div>

            <div class="input-group" id="input-file-container" style="display: none;">
                <div class="file-wrapper" id="file-wrap">
                    <span id="file-txt" style="font-size:13px; color:#64748b; font-weight:600;"><i class="fa-solid fa-image"></i> Select Thumbnail Image</span>
                    <input type="file" id="task-image-file" accept="image/*" onchange="processFileImage(this)">
                </div>
            </div>

            <div class="img-preview-box">
                <img id="preview-img" src="" alt="Live Preview">
                <span id="preview-placeholder">No Thumbnail Loaded</span>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label><i class="fa-solid fa-money-bill-wave"></i> Reward (৳)</label>
                    <input type="number" id="task-reward" step="0.01" placeholder="5.00">
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-users"></i> Total User Limit (কতোজন করতে পারবে)</label>
                    <input type="number" id="task-limit" placeholder="100" value="100">
                </div>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-user-lock"></i> Per User Limit (১ ইউজার সর্বোচ্চ কতবার করবে)</label>
                <input type="number" id="task-user-limit" placeholder="e.g. 1" value="1">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-arrow-up-right-from-square"></i> Target Link</label>
                <input type="text" id="task-link" placeholder="https://youtube.com">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-align-left"></i> Step Guide</label>
                <textarea id="task-desc" rows="3" placeholder="Steps..."></textarea>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label><i class="fa-solid fa-camera"></i> Screenshots Required</label>
                    <select id="task-img-count">
                        <option value="1">1 Screenshot</option>
                        <option value="2">2 Screenshots</option>
                        <option value="0">No Screenshot</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-font"></i> Text Proof</label>
                    <select id="task-text-req">
                        <option value="yes">Required</option>
                        <option value="no">Not Required</option>
                    </select>
                </div>
            </div>

            <button class="submit-btn" id="upload-btn"><i class="fa-solid fa-cloud-arrow-up"></i> Launch Campaign</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbyV4futjEJjdAbR3dMNf6dOIhAuj7tTo",
            authDomain: "task-2503d.firebaseapp.com",
            projectId: "task-2503d",
            appId: "1:707479242322:web:492db72a3b86653a0d018b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const loader = document.getElementById('loader-overlay');

        let currentImageMode = 'link'; let finalImageString = ""; 

        function showLoader(msg) { document.getElementById('loader-msg').innerText = msg; loader.classList.add('active'); }
        function hideLoader() { loader.classList.remove('active'); }

        window.switchMode = (mode) => {
            currentImageMode = mode; finalImageString = "";
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('preview-placeholder').style.display = 'block';
            if(mode === 'link') {
                document.getElementById('btn-link-mode').classList.add('active');
                document.getElementById('btn-file-mode').classList.remove('active');
                document.getElementById('input-link-container').style.display = 'block';
                document.getElementById('input-file-container').style.display = 'none';
            } else {
                document.getElementById('btn-file-mode').classList.add('active');
                document.getElementById('btn-link-mode').classList.remove('active');
                document.getElementById('input-link-container').style.display = 'none';
                document.getElementById('input-file-container').style.display = 'block';
            }
        };

        window.previewUrlImage = (url) => {
            const img = document.getElementById('preview-img');
            const placeholder = document.getElementById('preview-placeholder');
            if(url.trim() !== "") {
                finalImageString = url.trim(); img.src = finalImageString;
                img.style.display = 'block'; placeholder.style.display = 'none';
            }
        };

        window.processFileImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(input.files[0]);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = (img.height / img.width) * 400;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        finalImageString = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('preview-img').src = finalImageString;
                        document.getElementById('preview-img').style.display = 'block';
                        document.getElementById('preview-placeholder').style.display = 'none';
                    };
                };
            }
        };

        document.getElementById('upload-btn').onclick = async () => {
            const name = document.getElementById('task-name').value.trim();
            const reward = document.getElementById('task-reward').value.trim();
            const limit = document.getElementById('task-limit').value.trim();
            const userLimit = document.getElementById('task-user-limit').value.trim();
            const link = document.getElementById('task-link').value.trim();
            const desc = document.getElementById('task-desc').value.trim();
            const imgCount = document.getElementById('task-img-count').value;
            const textReq = document.getElementById('task-text-req').value;

            if(!name || !reward || !desc || !finalImageString) { alert("Fill all fields!"); return; }

            showLoader("Publishing Smart Task...");
            try {
                await addDoc(collection(db, "tasks"), {
                    name: name,
                    image: finalImageString,
                    reward: parseFloat(reward),
                    taskLimit: limit ? parseInt(limit) : 99999,
                    userLimit: userLimit ? parseInt(userLimit) : 1, // প্রতি ইউজারের লিমিট
                    completedCount: 0,
                    link: link || "",
                    description: desc,
                    imageProofCount: parseInt(imgCount),
                    textProofRequired: textReq === "yes" ? true : false,
                    createdAt: serverTimestamp()
                });
                alert("Smart Task Launched!");
                window.location.reload();
            } catch(e) { console.error(e); } finally { hideLoader(); }
        };
    </script>
</body>
</html>
